        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomLenormand(count) {
            let shuffled = shuffle(LENORMAND_DECK);
            return shuffled.slice(0, count);
        }

        function getBasePath() {
            let loc = window.location;
            if (loc.hostname.includes("github.io")) {
                let pathSegments = loc.pathname.split("/").filter(Boolean);
                if (pathSegments.length > 0) {
                    return "/" + pathSegments[0] + "/";
                }
            }
            return "./";
        }

        function createLenormandBoxHtml(c, posTitle) {
            let base = getBasePath();
            let imgPath = base + "lenormand/" + c.file;
            let polClass = {"正面": "badge-pos", "中性": "badge-neu", "負面": "badge-neg"}[c.polarity];

            let html = '<div class="leno-card-box">';
            if (posTitle) {
                html += '<div class="banner">' + posTitle + '</div>';
            }
            html += '<div class="leno-content">';
            html += '<img src="' + imgPath + '" class="leno-img" onerror="this.style.display=\'none\'">';
            html += '<div class="leno-info">';
            html += '<div class="leno-header-row">';
            html += '<span class="leno-name">[' + String(c.no).padStart(2,'0') + '] ' + c.name + ' (' + c.en + ')</span>';
            html += '<span class="polarity-badge ' + polClass + '">' + c.polarity + '</span>';
            html += '</div>';
            html += '<div style="color: #38bdf8;">▸ 撲克牌對應：' + c.suit + '</div>';
            html += '<div style="color: #cbd5e1;">▸ 核心主題：' + c.theme + '</div>';
            html += '<div class="leno-desc-box">▸ 現實關鍵字：' + c.keywords.join('、') + '</div>';
            html += '</div></div></div>';
            return html;
        }

        function createMiniCardHtml(c, titleText) {
            let base = getBasePath();
            let imgPath = base + "lenormand/" + c.file;
            return `
                <div class="mini-card">
                    <div class="mini-title">${titleText}</div>
                    <img src="${imgPath}" class="mini-img" onerror="this.style.display='none'">
                    <div class="mini-name">${c.name}</div>
                </div>
            `;
        }

        // 截圖功能：動態長駐滿版交錯斜向浮水印層後截圖
        function captureSpread() {
            let target = document.getElementById("spreadArea");
            let btnGroup = document.querySelector(".action-btn-group");
            if(btnGroup) btnGroup.style.display = "none";

            let totalHeight = target.scrollHeight;

            let watermarkContainer = document.createElement("div");
            watermarkContainer.className = "screenshot-watermark-container";
            watermarkContainer.style.height = totalHeight + "px";

            // 計算整張長圖所需的交錯浮水印密度
            let count = Math.max(24, Math.floor(totalHeight / 120));
            for(let i = 0; i < count; i++) {
                let item = document.createElement("div");
                item.className = "watermark-item";
                item.textContent = "🍸 醉酒塔羅 - 李特 @tarot.drunk";
                watermarkContainer.appendChild(item);
            }
            target.appendChild(watermarkContainer);

            html2canvas(target, {
                backgroundColor: "#0d0f14",
                scale: window.innerWidth < 768 ? 2.5 : 2, 
                useCORS: true,
                logging: false
            }).then(canvas => {
                target.removeChild(watermarkContainer);
                if(btnGroup) btnGroup.style.display = "flex";

                let dataUrl = canvas.toDataURL("image/png");
                let isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
                
                if (isMobile) {
                    document.getElementById("screenshotResultImg").src = dataUrl;
                    document.getElementById("screenshotModal").style.display = "flex";
                } else {
                    let link = document.createElement("a");
                    link.download = "醉酒塔羅-雷諾曼占卜結果.png";
                    link.href = dataUrl;
                    link.click();
                }
            }).catch(err => {
                if(watermarkContainer.parentNode) target.removeChild(watermarkContainer);
                if(btnGroup) btnGroup.style.display = "flex";
                console.error("截圖失敗", err);
                alert("截圖產生失敗，請稍後再試");
            });
        }
